[project]
name = "cubrid-ci-watch"
version = "0.1.0"
description = "Track caller-identified CUBRID gha-ci requests in a local SQLite ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cubrid-ci-watch = "cubrid_ci_watch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cubrid_ci_watch"]
